# Local environment for the browser tests (see README, section "Browser tests").
# Azure values are read from .env next to this file, which is never committed.
name: nrzmyk-browsertests

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-BrowserTests#Local1}
    ports:
      - "127.0.0.1:${SQL_PORT:-14330}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: NRZMyk.Server/Dockerfile
    depends_on:
      sql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-5080}:8080"
    # Azure values (AzureAdB2C__*), see .env.example. Only values set there override appsettings.json.
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=sql;Database=NRZMyk;User Id=sa;Password=${MSSQL_SA_PASSWORD:-BrowserTests#Local1};TrustServerCertificate=True"
      # No external side effects: reminder job off, no working e-mail key.
      # Server telemetry stays off because no Application Insights connection string is set.
      Application__SentinelReminderJob: "Disabled"
      SendGrid__ApiKey: "disabled-in-browser-tests"
